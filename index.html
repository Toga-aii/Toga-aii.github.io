<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portfolio Achille Pommier-Raymond</title>
<meta name="description" content="Portfolio BTS SIO SISR — Achille Pommier-Raymond. Parcours, projets, stages, compétences et veille technologique.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: sticky header + one view per hash route; home is a long scroll, inner pages are focused sheets. Single dark theme by choice. */
:root{
  --bg:#0c1016; --surface:#131924; --surface-2:#1a2230; --line:#253041;
  --text:#ece8e1; --muted:#929bab; --accent:#f5a524; --accent-2:#ff7a1a; --ok:#3ecf8e;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Consolas, monospace;
  --r:14px; --max:1120px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{animation:none!important;transition:none!important}}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.65 var(--body);
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:56px 56px;background-attachment:fixed;background-blend-mode:normal}
body::before{content:"";position:fixed;inset:0;background:radial-gradient(1200px 600px at 75% -10%,rgba(245,165,36,.10),transparent 60%),linear-gradient(var(--bg) 0,rgba(12,16,22,.93) 100%);z-index:-1;pointer-events:none}
img{max-width:100%;display:block}
a{color:var(--accent);text-underline-offset:3px}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:6px}
h1,h2,h3{font-family:var(--display);line-height:1.1;text-wrap:balance;margin:0}
h2{font-size:clamp(1.9rem,4vw,2.7rem);font-weight:800;letter-spacing:-.02em}
h3{font-size:1.25rem;font-weight:600}
p{margin:0}
.wrap{max-width:var(--max);margin:0 auto;padding:0 20px}

/* Header */
header{position:sticky;top:0;z-index:20;background:rgba(12,16,22,.86);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:16px;height:64px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--text);font-family:var(--display);font-weight:800;font-size:1.05rem;white-space:nowrap}
.brand .tag{font:500 .72rem var(--mono);color:var(--bg);background:var(--accent);padding:2px 7px;border-radius:5px}
.brand span.l{color:var(--accent)}
nav ul{display:flex;gap:4px;list-style:none;margin:0;padding:0}
nav a{display:block;padding:7px 11px;border-radius:8px;color:var(--muted);text-decoration:none;font-size:.92rem;white-space:nowrap}
nav a:hover{color:var(--text);background:var(--surface)}
nav a[aria-current="page"]{color:var(--accent);background:rgba(245,165,36,.10)}
#menu{display:none;background:var(--surface);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font:500 .9rem var(--body);cursor:pointer}
@media (max-width:980px){
  #menu{display:block}
  nav{position:absolute;left:0;right:0;top:64px;background:var(--bg);border-bottom:1px solid var(--line);display:none}
  nav.open{display:block}
  nav ul{flex-direction:column;padding:10px 20px 16px}
}

/* Generic blocks */
section.block{padding:72px 0 0}
.eyebrow{font:500 .78rem var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-bottom:12px;display:block}
.lead{color:var(--muted);max-width:62ch;margin-top:14px;font-size:1.05rem}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:24px}
.card h3+p,.card h3+ul{margin-top:10px}
.muted{color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:500 .78rem var(--mono);padding:5px 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface-2);color:var(--text)}
.chip.a{border-color:rgba(245,165,36,.4);color:var(--accent);background:rgba(245,165,36,.08)}
.todo{display:inline-flex;align-items:center;gap:6px;font:500 .78rem var(--mono);color:var(--accent);border:1px dashed rgba(245,165,36,.6);border-radius:6px;padding:3px 9px;background:rgba(245,165,36,.05)}
.todo::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent)}
ul.list{margin:0;padding:0;list-style:none;display:grid;gap:7px}
ul.list li{position:relative;padding-left:20px}
ul.list li::before{content:"";position:absolute;left:2px;top:.68em;width:8px;height:2px;background:var(--accent)}
.btn{display:inline-flex;align-items:center;gap:8px;padding:12px 20px;border-radius:999px;font-weight:600;text-decoration:none;border:1px solid var(--line);color:var(--text);background:var(--surface);cursor:pointer;font-family:var(--body);font-size:.95rem}
.btn.p{background:var(--accent);color:#1a1205;border-color:var(--accent)}
.btn:hover{transform:translateY(-1px)}
.btn{transition:transform .15s}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.kv{display:grid;grid-template-columns:160px 1fr;gap:10px 18px}
.kv dt{font:500 .76rem var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding-top:3px}
.kv dd{margin:0}
@media (max-width:560px){.kv{grid-template-columns:1fr;gap:2px}.kv dd{margin-bottom:12px}}

/* Hero */
.hero{padding:72px 0 24px;display:grid;grid-template-columns:1.15fr .85fr;gap:40px;align-items:center}
@media (max-width:900px){.hero{grid-template-columns:1fr;padding-top:48px}}
.hero h1{font-size:clamp(2.4rem,5.6vw,4.3rem);font-weight:800;letter-spacing:-.035em}
.hero h1 .name{display:block;background:linear-gradient(95deg,var(--accent),var(--accent-2));-webkit-background-clip:text;background-clip:text;color:transparent;padding-bottom:.06em}
.hero h1 .hi{display:block;font-size:.42em;font-weight:600;letter-spacing:-.01em;color:var(--muted);margin-bottom:10px}
.hero .sub{font-size:1.15rem;margin-top:18px;font-weight:500}
.hero p.desc{color:var(--muted);max-width:56ch;margin-top:10px}
.hero .row{margin-top:28px}
.term{background:#090c11;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:0 30px 80px -30px rgba(245,165,36,.25);font:13.5px/1.75 var(--mono)}
.term .top{display:flex;align-items:center;gap:7px;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--surface)}
.term .top i{width:10px;height:10px;border-radius:50%;background:var(--line)}
.term .top span{margin-left:8px;color:var(--muted);font-size:12px}
.term pre{margin:0;padding:18px 18px 20px;white-space:pre-wrap;color:#c9cfd8;overflow-x:auto}
.term .p{color:var(--ok)} .term .c{color:var(--accent)} .term .d{color:var(--muted)}
.term .up{color:var(--ok)}
.cursor{display:inline-block;width:8px;height:1.1em;vertical-align:-3px;background:var(--accent);animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}

.ticker{border-block:1px solid var(--line);margin-top:56px;overflow:hidden;background:rgba(19,25,36,.6)}
.ticker div{display:flex;gap:40px;width:max-content;padding:14px 0;animation:slide 40s linear infinite;font:500 .8rem var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.ticker b{color:var(--accent);font-weight:500}
@keyframes slide{to{transform:translateX(-50%)}}

/* Timeline */
.tl{list-style:none;margin:36px 0 0;padding:0;display:grid;grid-template-columns:repeat(5,1fr);gap:0;counter-reset:s}
.tl li{position:relative;padding:28px 18px 0 0;border-top:2px solid var(--line)}
.tl li::before{content:"";position:absolute;top:-7px;left:0;width:12px;height:12px;border-radius:50%;background:var(--bg);border:2px solid var(--accent)}
.tl li.done::before{background:var(--accent)}
.tl .yr{font:500 .78rem var(--mono);color:var(--accent);letter-spacing:.06em}
.tl h3{margin:6px 0 6px;font-size:1.1rem}
.tl p{color:var(--muted);font-size:.92rem}
@media (max-width:900px){.tl{grid-template-columns:1fr;gap:0}.tl li{border-top:0;border-left:2px solid var(--line);padding:0 0 26px 24px}.tl li::before{left:-7px;top:4px}}

/* Skills */
.skillgrp h3{font:500 .78rem var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:12px}

/* Project feature */
.feat{display:grid;grid-template-columns:1fr 1fr;gap:28px;align-items:start}
@media (max-width:900px){.feat{grid-template-columns:1fr}}
.shot{border-radius:10px;border:1px solid var(--line);overflow:hidden;background:#000;cursor:zoom-in;padding:0;width:100%;text-align:left;color:inherit;font:inherit}
.shot img{width:100%;height:auto}
figure{margin:0}
figcaption{font-size:.85rem;color:var(--muted);margin-top:8px}
.ph{border:1px dashed var(--line);border-radius:10px;min-height:170px;display:grid;place-items:center;text-align:center;padding:20px;color:var(--muted);font-size:.9rem;background:rgba(19,25,36,.5)}
.ph b{display:block;font:500 .74rem var(--mono);letter-spacing:.12em;color:var(--accent);margin-bottom:6px}

/* Page header for inner views */
.phead{padding:64px 0 8px;border-bottom:1px solid var(--line)}
.phead h1{font-size:clamp(2.4rem,5.5vw,4rem);font-weight:800;letter-spacing:-.03em}
.phead .lead{margin-bottom:36px}

/* Accordion */
details.acc{border:1px solid var(--line);border-radius:12px;background:var(--surface)}
details.acc+details.acc{margin-top:10px}
details.acc summary{cursor:pointer;list-style:none;padding:16px 20px;font-weight:600;display:flex;justify-content:space-between;align-items:center;gap:12px}
details.acc summary::-webkit-details-marker{display:none}
details.acc summary::after{content:"+";font:500 1.2rem var(--mono);color:var(--accent)}
details.acc[open] summary::after{content:"−"}
details.acc .in{padding:0 20px 20px;display:grid;gap:14px}
details.acc h4{font:500 .74rem var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin:0 0 4px}

/* Stages */
.stage{margin-top:40px}
.stage-h{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;align-items:end;margin-bottom:22px}
.stage-h h2{font-size:clamp(1.7rem,3.4vw,2.3rem)}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.gallery .shot img{aspect-ratio:16/10;object-fit:cover;object-position:top left}
.gallery .shot img.wide{object-fit:contain;object-position:center}

/* Veille */
.month{font:500 .82rem var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:30px 0 14px;display:flex;align-items:center;gap:12px}
.month::after{content:"";flex:1;height:1px;background:var(--line)}
.art .meta{display:flex;flex-wrap:wrap;gap:8px 14px;font:500 .78rem var(--mono);color:var(--muted);margin-bottom:10px}
.art h3{font-size:1.15rem;margin-bottom:10px}
.art .pert{font-size:.88rem;color:var(--accent);margin-bottom:10px}
.art p.res{color:#c6ccd6;font-size:.95rem}
.art .go{margin-top:14px;display:inline-block;font-weight:600;font-size:.92rem}

/* Guide */
.rule .n{font:500 .8rem var(--mono);color:var(--accent)}
.rule h3{margin:4px 0 12px}

/* Contact */
.cta{margin:88px 0 0;padding:40px;border-radius:20px;border:1px solid rgba(245,165,36,.35);background:linear-gradient(120deg,rgba(245,165,36,.12),rgba(255,122,26,.04) 60%,transparent);display:flex;flex-wrap:wrap;gap:20px;justify-content:space-between;align-items:center}
.cta h2{font-size:clamp(1.6rem,3vw,2.2rem)}

footer{margin-top:96px;border-top:1px solid var(--line);padding:32px 0 40px;color:var(--muted);font-size:.88rem}
footer .row{justify-content:space-between}
footer nav{position:static;display:block;background:none;border:0}
footer nav ul{flex-direction:row;flex-wrap:wrap;padding:0}

/* Lightbox */
#lb{position:fixed;inset:0;z-index:50;background:rgba(5,7,10,.92);display:none;align-items:center;justify-content:center;padding:24px;flex-direction:column;gap:12px}
#lb.on{display:flex}
#lb img{max-height:82vh;max-width:min(1400px,100%);border-radius:8px;border:1px solid var(--line)}
#lb p{color:var(--muted)}
#lb button{position:absolute;top:16px;right:16px}
.view[hidden]{display:none}
.copied{font:500 .78rem var(--mono);color:var(--ok)}
</style>
</head>
<body>
<header>
  <div class="wrap bar">
    <a class="brand" href="#accueil"><span class="tag">SISR</span>Achille <span class="l">Pommier-Raymond</span></a>
    <button id="menu" aria-expanded="false" aria-controls="nav">Menu</button>
    <nav id="nav" aria-label="Navigation principale"><ul id="navlist"></ul></nav>
  </div>
</header>

<main id="app" class="wrap"></main>

<footer>
  <div class="wrap">
    <div class="row">
      <div><strong style="color:var(--text)">Achille Pommier-Raymond</strong><br>Portfolio BTS SIO SISR – 2026</div>
      <nav aria-label="Navigation de pied de page"><ul id="footnav"></ul></nav>
    </div>
    <p style="margin-top:18px">Lycée de la CCI – Nîmes · BTS Services Informatiques aux Organisations, option SISR · 2024 - 2026</p>
  </div>
</footer>

<div id="lb" role="dialog" aria-modal="true" aria-label="Image agrandie">
  <button class="btn" id="lbclose">Fermer ✕</button>
  <img id="lbimg" alt="">
  <p id="lbcap"></p>
</div>

<script>
const TODO = (t='À compléter') => `<span class="todo">${t}</span>`;
const PH = (title, sub='') => `<div class="ph"><div><b>IMAGE À AJOUTER</b>${title}${sub?`<br><span style="font-size:.82rem">${sub}</span>`:''}</div></div>`;
const shot = (src, cap) => `<figure><button class="shot" data-src="${src}" data-cap="${cap}" aria-label="Agrandir : ${cap}"><img src="${src}" alt="${cap}" loading="lazy"${src.includes('nav.')?' class="wide"':''}></button><figcaption>${cap}</figcaption></figure>`;
const list = items => `<ul class="list">${items.map(i=>`<li>${i}</li>`).join('')}</ul>`;
const chips = (items, cls='') => `<div class="chips">${items.map(i=>`<span class="chip ${cls}">${i}</span>`).join('')}</div>`;
const head = (eyebrow, title, lead='') => `<div class="phead"><span class="eyebrow">${eyebrow}</span><h1>${title}</h1>${lead?`<p class="lead">${lead}</p>`:''}</div>`;
const sec = (eyebrow, title, inner, lead='') => `<section class="block"><span class="eyebrow">${eyebrow}</span><h2>${title}</h2>${lead?`<p class="lead">${lead}</p>`:''}<div style="margin-top:28px">${inner}</div></section>`;

const ROUTES = [
  ['accueil','Accueil'],['presentation','Présentation'],['ap1','AP1'],['ap2','AP2'],
  ['stages','Stages'],['veille','Veille technologique'],['guide','Guide de bonne conduite'],['contact','Contact']
];

/* ---------- Données ---------- */
const THERMES_GALLERY = [
  ['img/thermes.webp','Les Thermes de Balaruc-les-Bains'],
  ['img/dashboard.webp',"Dashboard de l'application de gestion de stock"],
  ['img/stock.webp','Gestion du stock et des équipements'],
  ['img/carte.webp','Carte interactive de localisation du matériel'],
  ['img/audit.webp',"Journal d'audit et historique des actions"],
  ['img/etiquette.webp',"Génération d'étiquettes avec codes-barres"],
  ['img/glpi.webp','GLPI — suivi des tickets utilisateurs'],
  ['img/phpmyadmin.webp','Base de données stock_app (phpMyAdmin)'],
  ['img/xampp.webp','Serveur XAMPP (Apache, MySQL, PHP)'],
  ['img/nav.webp',"Navigation de l'application TheStock"],
  ['img/structure.webp','Structure du projet PHP sur le serveur'],
];
const STOCK_FEATURES = ['Suivi des équipements','Gestion des emplacements','Réservations avec gestion des conflits','Mouvements de stock',"Journal d'audit",'Carte interactive','Génération de codes-barres','Export CSV'];
const STOCK_TECH = ['HTML','CSS','PHP','MySQL','XAMPP','Windows Server 2022'];

const VEILLE = {
  vr:{title:'Réalité virtuelle / réalité augmentée', tag:'VR / AR',
    obj:"Suivre les évolutions des casques de réalité virtuelle, de réalité augmentée et de réalité mixte, les nouvelles technologies d'affichage, les lunettes connectées, les usages professionnels, les applications dans le jeu vidéo et les évolutions des principaux acteurs du marché.",
    months:[
      {label:'Septembre 2026', arts:[
        {n:1,title:"J'ai essayé les lunettes de Google et Xreal (Aura) et je pense que les casques VR sont cuits",date:'22 mai 2026',src:'Numerama — Nicolas Lellouche',link:'https://www.numerama.com/tech/2258363-jai-essaye-les-lunettes-de-google-et-xreal-aura-et-je-pense-que-les-casques-vr-sont-cuits.html',pert:'Très élevée — réalité augmentée / Android XR',
         res:"Google et Xreal ont présenté les lunettes Project Aura utilisant Android XR. Contrairement à un casque VR classique, ces lunettes permettent d'afficher des éléments numériques directement dans le champ de vision tout en conservant une vision du monde réel. Elles utilisent notamment des technologies de guide d'onde et des écrans Micro-OLED. Le projet montre l'évolution du secteur vers des appareils plus légers et plus faciles à utiliser au quotidien. Il constitue donc un très bon exemple de l'évolution de la réalité augmentée vers des lunettes pouvant remplacer progressivement certains usages des casques VR."},
        {n:2,title:'Samsung et Google défient les Ray-Ban Meta avec des lunettes connectées nouvelle génération',date:'19 mai 2026',src:'Frandroid',link:'https://www.frandroid.com/marques/samsung/3104109_samsung-et-google-defient-les-ray-ban-meta-avec-des-lunettes-connectees-nouvelle-generation',pert:'Très élevée — Android XR / lunettes connectées',
         res:"Samsung et Google ont présenté leurs nouvelles lunettes utilisant Android XR et Gemini. L'objectif est de rapprocher les assistants IA et la réalité augmentée des usages quotidiens. Les lunettes peuvent notamment utiliser des informations provenant de leur environnement pour proposer des interactions avec l'utilisateur. Cette évolution montre que les entreprises cherchent à déplacer progressivement certaines fonctions des smartphones vers des lunettes connectées. Elle illustre également le rapprochement entre intelligence artificielle et réalité augmentée."}
      ]},
      {label:'Octobre 2026', arts:[
        {n:3,title:"Acer lance à son tour ses propres lunettes connectées, et la réalité augmentée est au menu",date:'4 juin 2026',src:'01net',link:'https://www.01net.com/actualites/acer-lance-a-son-tour-ses-propres-lunettes-connectees-et-la-realite-augmentee-est-au-menu.html',pert:'Très élevée — réalité augmentée',
         res:"Acer a présenté deux modèles de lunettes connectées, dont les AR Vision GR0 conçues pour proposer une expérience de réalité augmentée. Le marché commence donc à accueillir de plus en plus de fabricants en plus de Meta, Google et Samsung. Cette évolution montre que les lunettes AR deviennent progressivement un secteur stratégique. L'article permet également de comparer différentes approches matérielles de la réalité augmentée. Il est intéressant pour suivre la démocratisation de cette technologie."},
        {n:4,title:"Asus ROG Xreal R1 : Asus s'associe au leader des lunettes AR pour jouer sans écran",date:'18 mai 2026',src:'Frandroid',link:'https://www.frandroid.com/marques/asus/3100693_rog-xreal-r1-asus-sassocie-au-leader-des-lunettes-ar-pour-jouer-sans-ecran',pert:'Élevée — réalité augmentée / gaming',
         res:"Asus s'est associé à Xreal pour développer les ROG Xreal R1, des lunettes destinées notamment au jeu vidéo. Elles intègrent des écrans directement dans les lunettes afin de permettre de jouer sans utiliser un écran classique. Ce projet montre que la réalité augmentée peut dépasser les usages professionnels ou expérimentaux pour s'intégrer dans le divertissement. Il illustre également l'évolution des écrans personnels vers des formats portables."}
      ]},
      {label:'Novembre 2026', arts:[
        {n:5,title:"Meta réaffirme travailler sur plusieurs casques VR de nouvelle génération",date:'9 juillet 2026',src:'UploadVR — David Heaney',link:'https://www.uploadvr.com/meta-cto-reaffirms-work-on-multiple-next-generation-headsets-hin/',pert:'Élevée — réalité virtuelle',
         res:"Meta a confirmé continuer à travailler sur plusieurs générations de casques de réalité virtuelle. Cette annonce intervient alors que l'entreprise a également réorienté une partie de ses investissements vers les lunettes connectées. Le développement de nouveaux casques montre toutefois que Meta n'abandonne pas complètement la réalité virtuelle. L'article permet donc de suivre l'évolution de la stratégie de l'un des principaux acteurs du marché VR."},
        {n:6,title:"Meta ferme les portes du Métavers sur ses casques VR",date:'18 mars 2026',src:'Frandroid',link:'https://www.frandroid.com/marques/meta/3030837_meta-ferme-les-portes-du-metavers-sur-ses-casques-vr',pert:'Élevée — réalité virtuelle / métavers',
         res:"Meta a annoncé une importante évolution concernant Horizon Worlds, son univers virtuel destiné notamment aux casques Quest. Cette décision montre que l'entreprise revoit ses ambitions concernant le métavers et la réalité virtuelle sociale. Le marché VR ne disparaît pas pour autant, mais les usages et les investissements évoluent. Cet article est intéressant car une veille technologique ne doit pas uniquement présenter les innovations : elle doit aussi montrer les échecs, les changements de stratégie et les limites d'une technologie."}
      ]}

/* ---------- Routage ---------- */
const app = document.getElementById('app');
const nav = document.getElementById('nav');
const menuBtn = document.getElementById('menu');
const links = ROUTES.map(([id,label])=>`<li><a href="#${id}" data-r="${id}">${label}</a></li>`).join('');
document.getElementById('navlist').innerHTML = links;
document.getElementById('footnav').innerHTML = links;

function render(){
  const id = (location.hash||'#accueil').slice(1);
  const key = VIEWS[id] ? id : 'accueil';
  app.innerHTML = VIEWS[key]();
  document.querySelectorAll('a[data-r]').forEach(a=>{ if(a.dataset.r===key) a.setAttribute('aria-current','page'); else a.removeAttribute('aria-current'); });
  document.title = key==='accueil' ? 'Portfolio Achille Pommier-Raymond' : `${ROUTES.find(r=>r[0]===key)[1]} — Achille Pommier-Raymond`;
  window.scrollTo(0,0);
  nav.classList.remove('open'); menuBtn.setAttribute('aria-expanded','false');
}
window.addEventListener('hashchange', render);
render();

menuBtn.addEventListener('click',()=>{const o=nav.classList.toggle('open');menuBtn.setAttribute('aria-expanded',o)});

/* Lightbox, scroll et copie */
const lb=document.getElementById('lb'), lbimg=document.getElementById('lbimg'), lbcap=document.getElementById('lbcap');
document.addEventListener('click', e=>{
  const s = e.target.closest('.shot');
  if (s){ lbimg.src=s.dataset.src; lbimg.alt=s.dataset.cap; lbcap.textContent=s.dataset.cap; lb.classList.add('on'); document.getElementById('lbclose').focus(); return; }
  const sc = e.target.closest('[data-scroll]');
  if (sc){ e.preventDefault(); document.getElementById(sc.dataset.scroll)?.scrollIntoView({behavior:'smooth'}); return; }
  const cp = e.target.closest('[data-copy]');
  if (cp){ navigator.clipboard?.writeText(cp.dataset.copy).then(()=>{cp.textContent='Copié ✓'; setTimeout(()=>cp.textContent='Copier',1800)}).catch(()=>{cp.textContent='Sélectionnez l\'adresse'}); }
});
const closeLb=()=>lb.classList.remove('on');
document.getElementById('lbclose').addEventListener('click',closeLb);
lb.addEventListener('click',e=>{ if(e.target===lb) closeLb(); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeLb(); });
</script>
